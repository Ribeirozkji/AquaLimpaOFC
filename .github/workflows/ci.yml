name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP lint
        run: |
          find AquaLimpaOficial-main/backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Start PHP server
        run: php -S 127.0.0.1:8000 -t AquaLimpaOficial-main >/tmp/php-server.log 2>&1 &
      - name: Integration smoke test
        env:
          BASE_URL: http://127.0.0.1:8000
        run: bash AquaLimpaOficial-main/tests/integration/auth_endpoints.sh
