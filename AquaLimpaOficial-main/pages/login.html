<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqua Limpa - Login</title>
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <form action="../backend/login.php" method="POST">
    <div class="container">
      <h1 class="title"><span>AQUA</span> <span>LIMPA</span></h1>

      <label for="email">E-MAIL OU USUÁRIO</label>
      <input type="text" id="email" name="email" placeholder="Insira seu texto" required>

      <label for="senha">SENHA</label>
      <input type="password" id="senha" name="senha" placeholder="Insira seu texto" required>

      <div class="link">
        <a href="criarconta.html">Não tem conta? Clique Aqui</a>
      </div>
      <button type="submit" class="btn-entrar">Entrar</button>

      <div class="social-login">
        <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google">
        <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook">
      </div>
    </div>
    <input type="hidden" name="csrf_token" id="csrf_token">
  </form>
  <script>
    fetch("../backend/csrf.php", { credentials: "same-origin" })
      .then(r => r.json())
      .then(data => {
        if (data && data.csrf_token) {
          const el = document.getElementById("csrf_token");
          if (el) el.value = data.csrf_token;
        }
      });
  </script>
</body>
</html>
