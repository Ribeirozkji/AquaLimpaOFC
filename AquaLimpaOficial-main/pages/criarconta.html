<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqua Limpa - Cadastro</title>
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <div class="container">
    <h1><span class="azul">AQUA</span> <span class="verde">LIMPA</span></h1>

    <form action="../backend/cadastro.php" method="POST">
      <label for="nome">NOME DO USUÁRIO</label>
      <input type="text" id="nome" name="nome" placeholder="Insira seu texto" required>

      <label for="data">DATA DE NASCIMENTO</label>
      <input type="date" id="data" name="data_nascimento" required>

      <label for="email">EMAIL</label>
      <input type="email" id="email" name="email" placeholder="Insira seu texto" required>

      <label for="senha">SENHA</label>
      <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>

      <button type="submit" class="btn-cadastrar">Cadastrar</button>
      <input type="hidden" name="csrf_token" id="csrf_token">
    </form>
  </div>
  <script>
    fetch("../backend/csrf.php", { credentials: "same-origin" })
      .then(r => r.json())
      .then(data => {
        if (data && data.csrf_token) {
          const el = document.getElementById("csrf_token");
          if (el) el.value = data.csrf_token;
        }
      });
  </script>
</body>
</html>
